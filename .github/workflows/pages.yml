# Deploys the pre-generated calibration pages in `site/` to GitHub Pages.
#
# There is no backend and no build step here on purpose. Every page in `site/`
# is a static file rendered ahead of time from a pinned JSON report
# (`scripts/render.ts`), contains no JavaScript beyond native <details>, and
# makes no network request when viewed. Nothing is scanned at view time, so the
# deployment cannot show a result that differs from the committed report — the
# same property `pnpm verify:pages` checks in CI.
#
# Only reports whose `disclosure.publishable` is true are rendered, so the
# disclosure gate governs what is deployed rather than a hand-maintained list.
name: Deploy report site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a running deploy halfway; queue instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `version:` here ON PURPOSE. package.json's `packageManager` field
      # (pnpm@11.24.0) is the single source of truth, and pnpm/action-setup
      # reads it. Declaring a version in both places is a hard error —
      # "Multiple versions of pnpm specified" — and pinning 9 here while the
      # lockfile was written by 11 is the kind of skew `--frozen-lockfile`
      # exists to catch.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Deploy only what the honesty checks pass. If a page's headline figure
      # no longer matches its source report, or a reassuring verdict sits on an
      # incomplete enumeration, this fails and nothing ships.
      - run: pnpm verify:pages

      # And the prose alongside it: verify:claims re-checks the documented
      # figures, per-protocol verdicts and page references against the reports.
      # A deployment whose own README describes a different result than the
      # pages it ships is the day-6 drift failure, shipped.
      - run: pnpm verify:claims

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
