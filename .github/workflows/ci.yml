name: CI

on:
  push:
  pull_request:

jobs:
  typecheck-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `version:` here ON PURPOSE. package.json's `packageManager` field
      # (pnpm@11.24.0) is the single source of truth, and pnpm/action-setup
      # reads it. Declaring a version in both places is a hard error —
      # "Multiple versions of pnpm specified" — and pinning 9 here while the
      # lockfile was written by 11 is the kind of skew `--frozen-lockfile`
      # exists to catch.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

      # The rendered calibration pages are checked against the pinned reports
      # they came from: every headline figure must still resolve to the same
      # value at the same JSON path, and the honesty properties (an undetermined
      # verdict never wearing the healthy tone, an unproven delay never shown as
      # a settled window, a partial reconstruction always labelled, only
      # publishable reports rendered) must still hold. Needs no network — both
      # sides are committed — so it belongs in CI rather than in a manual pass.
      - run: pnpm verify:pages

      # The prose is checked against the reports too. verify:pages protects the
      # rendered figures; nothing protected the sentences in README/CLAUDE.md,
      # and on day 6 that gap produced a real error — a demo beat asserting that
      # one contract both had paused()==true AND produced a $748.90 drain proof.
      # Neither contract had both. It survived three days and was caught only by
      # actually running the documented command from a clean clone.
      - run: pnpm verify:claims

  # Secret scan over the FULL history, every run.
  #
  # This deliberately does NOT use gitleaks/gitleaks-action@v2. That action
  # derives a commit RANGE from the push event and scans only that, as
  # `<base>^..<head>` — which is not a valid revision when the push contains the
  # repository's first commit, because the first commit has no parent. Observed
  # live on this repo: the action died with "ambiguous argument
  # fe1181d...^..7e0cf55", scanned ~0 bytes, and printed "no leaks found in
  # partial scan" alongside a failing exit code.
  #
  # A scanner that scans nothing and reports clean is precisely the failure mode
  # this project exists to refuse, so the range arithmetic is removed entirely:
  # `gitleaks detect` with no range scans the whole history, every time. It costs
  # under two seconds on this repo and it cannot silently degrade to a partial
  # scan.
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # PINNED, and the pin is load-bearing rather than hygiene. `.gitleaks.toml`
      # uses the `[[allowlists]]` (plural) block, which gitleaks 8.24.3 — the
      # version gitleaks-action installs — does not honour: on this repository it
      # reports 102 findings where 8.30.1 reports 0, because it silently ignores
      # the allowlist rather than failing to parse it. Verified locally against
      # both release binaries before pinning. A scanner whose config is only
      # partly applied is a scanner reporting on rules nobody wrote.
      - name: Install gitleaks (pinned)
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Scan full history
        run: |
          # Fail loud if the scan did not actually walk the history. The failure
          # this guards against is not a leak — it is a scan that covers nothing
          # and reports clean, which is what the replaced action did here.
          COMMITS=$(git rev-list --all --count)
          echo "history: $COMMITS commits"
          test "$COMMITS" -gt 0
          gitleaks detect --source . --config .gitleaks.toml --redact -v
