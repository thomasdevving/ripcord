name: CI

on:
  push:
  pull_request:

jobs:
  typecheck-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

      # The rendered calibration pages are checked against the pinned reports
      # they came from: every headline figure must still resolve to the same
      # value at the same JSON path, and the honesty properties (an undetermined
      # verdict never wearing the healthy tone, an unproven delay never shown as
      # a settled window, a partial reconstruction always labelled, only
      # publishable reports rendered) must still hold. Needs no network — both
      # sides are committed — so it belongs in CI rather than in a manual pass.
      - run: pnpm verify:pages

      # The prose is checked against the reports too. verify:pages protects the
      # rendered figures; nothing protected the sentences in README/CLAUDE.md,
      # and on day 6 that gap produced a real error — a demo beat asserting that
      # one contract both had paused()==true AND produced a $748.90 drain proof.
      # Neither contract had both. It survived three days and was caught only by
      # actually running the documented command from a clean clone.
      - run: pnpm verify:claims

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
