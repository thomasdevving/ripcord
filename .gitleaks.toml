title = "ripcord gitleaks config"

[extend]
useDefault = true

# The guiding rule for every entry below: never widen an allowlist to a SHAPE,
# only to a CONTEXT. Allowlisting "all 40-hex-character strings" or "all 64-hex
# strings" would mask a real credential of the same shape, so each exception is
# either an individually-named public constant or a pattern anchored on
# surrounding text that only Ripcord itself generates.

[[allowlists]]
description = "Placeholders and non-secret fixtures"
regexes = [
  '''your-mainnet-rpc-provider\.example''',
  '''YOUR_KEY''',
  # Public, immutable mainnet contract addresses that appear in README examples
  # and curated data. These are not credentials — they are the addresses the
  # tool exists to read. Listed individually rather than allowlisting all
  # 40-hex-char strings, which would mask real secrets of the same shape.
  # (A `"token": "0x…"` key/value pair trips the generic-api-key heuristic.)
  '''0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48''', # USDC
  # The remaining major tokens, added day 3 for src/chain/priceFeeds.ts, where
  # a `token: "0x…"` field/value pair trips the same generic-api-key heuristic.
  # All are public, immutable mainnet ERC20 addresses — the things the tool
  # reads, not credentials.
  '''0xdAC17F958D2ee523a2206206994597C13D831ec7''', # USDT
  '''0x6B175474E89094C44Da98b954EedeAC495271d0F''', # DAI
  '''0xC02aaA39b223FE8D0A0e5C4F27eAD9083C756Cc2''', # WETH
  '''0x2260FAC5E5542a773Aa44fBCfeDf7C193bc2C599''', # WBTC
  '''0xae7ab96520DE3A18E5e111B5EaAb095312D7fE84''', # stETH
]
paths = [
  '''\.env\.example$''',
  '''test/fixtures/.*''',
]

# A second allowlist, targeting the whole LINE rather than the extracted secret.
# Needed because gitleaks matches `regexes` against the secret it pulled out, so
# an exception anchored on surrounding context has to say so explicitly.
#
# What this covers: AccessControl ROLE HASHES as they appear in Ripcord's own
# relation labels — `"relation": "accessControl:0x…"`, the matching `"label"`
# entries, and the `viaCapabilities` strings built from them. A role hash is a
# public, derivable identifier: keccak256 of the role's name. The one that trips
# this rule is keccak256("FULL_RESTRICTED_STAKER_ROLE") = 0x0a4af4bc… on
# Ethena's sUSDe — a value the report exists to publish, and one independently
# re-derivable with `npx tsx scripts/rolehash.ts FULL_RESTRICTED_STAKER_ROLE`.
# The `key: "value"` shape is what trips the generic-api-key heuristic.
#
# Anchored on the literal `accessControl:` prefix ON PURPOSE: only a label
# Ripcord itself generated can match, so a real secret of the same shape
# appearing anywhere else in the repository is still caught.
[[allowlists]]
description = "Public AccessControl role hashes in Ripcord's own relation labels"
regexTarget = "line"
regexes = ['''accessControl:0x[0-9a-f]{64}''']

[[allowlists]]
description = "Synthetic idempotency fixture in webapp job tests (including history)"
condition = "AND"
paths = ['''^test/webappJobs\.test\.ts$''']
regexes = ['''^abcdefgh1234$''']

[[allowlists]]
description = "Synthetic provider credential in the redaction regression (including history)"
condition = "AND"
paths = ['''^test/webappValidation\.test\.ts$''']
regexes = ['''^AbCdEf0123456789AbCdEf0123456789AbCd$''']
